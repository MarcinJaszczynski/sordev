; SOR41 — Supervisor queue worker (Redis)
; Instalacja:
;   sudo cp deploy/config/supervisor/travel-office-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;
; Wymaga: QUEUE_CONNECTION=redis w shared/.env

[program:travel-office-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/travel-office/current/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=deploy
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/travel-office/shared/logs/supervisor-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
stopwaitsecs=3600
