; SOR41 — opcjonalny fallback schedulera (ZALECANY jest cron zamiast tego)
; Laravel wymaga JEDNEGO wpisu cron: * * * * * php artisan schedule:run
; Ten plik tylko gdy cron jest niedostępny.

[program:travel-office-scheduler]
command=php /var/www/travel-office/current/artisan schedule:work
autostart=false
autorestart=true
user=deploy
redirect_stderr=true
stdout_logfile=/var/www/travel-office/shared/logs/supervisor-scheduler.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
