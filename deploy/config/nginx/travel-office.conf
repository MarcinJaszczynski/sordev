# SOR41 — Nginx vhost (Ubuntu 24.04)
# Instalacja:
#   sudo cp deploy/config/nginx/travel-office.conf /etc/nginx/sites-available/travel-office.conf
#   sudo ln -sf /etc/nginx/sites-available/travel-office.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Zamień: app.example.com, ścieżki SSL

upstream travel_office_php {
    server unix:/run/php/php8.4-fpm.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.example.com;

    # Po certbot: przekierowanie na HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;

    root /var/www/travel-office/current/public;
    index index.php;

    charset utf-8;

    # SSL — certbot wypełni te ścieżki
    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;

    client_max_body_size 64M;

    access_log /var/log/nginx/travel-office-access.log;
    error_log  /var/log/nginx/travel-office-error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Health check — bez logowania (opcjonalnie)
    location = /up {
        access_log off;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass travel_office_php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Assety Vite — długi cache
    location ~* ^/vite-dist/.+\.(js|css|svg|woff2?|ttf|eot|png|jpg|jpeg|gif|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Skompresowane assety (.br / .gz) — opcjonalnie po vite-plugin-compression
    location ~* ^/vite-dist/.+\.(js|css)\.(br|gz)$ {
        gzip off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary Accept-Encoding;
        try_files $uri =404;
    }
}
